
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Slide Foto</title>
  <style>
    .slider {
      max-width: 600px;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }
    .slides {
      display: flex;
      width: 500%;
      animation: slide 9s infinite;
    }
    .slides img {
      width: 100%;
      height: 350px;
      object-fit: cover;
    }
    @keyframes slide {
      0%, 16% { transform: translateX(0); }
      20%, 46% { transform: translateX(-20%); }
      40%, 56% { transform: translateX(-40%); }
      60%, 76% { transform: translateX(-60%); }
      80%, 96% { transform: translateX(-80%); }
      100%, 116% { transform: translateX(-100%); }
      120%, 136% { transform: translateX(-120%); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>
<center><h1>masuk neraka karna lisan</h1></center>

  <div class="slider">
    <div class="slides">
      <img src="Masuk neraka karena lisan(1)" alt="Foto 1">
      <img src="https://picsum.photos/600/350?random=2" alt="Foto 2">
      <img src="https://picsum.photos/600/350?random=3" alt="Foto 3">
    </div>
  </div>

</body>
</html>
